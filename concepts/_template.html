<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>개념 이름</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]})"></script>
  <script src="site.js"></script>
</head>
<body>
<main>
  <h1>개념 이름</h1>
  <p class="summary">한 줄 요약: 이 개념이 무엇이고 왜 필요한가.</p>

  <h2>직관</h2>
  <figure>
    <svg viewBox="0 0 600 200" role="img" aria-label="그림 설명">
      <!-- 색은 var(--accent), var(--accent-2), var(--accent-3), currentColor 사용 -->
    </svg>
    <figcaption>그림이 보여주는 것 한 줄.</figcaption>
  </figure>
  <p>그림을 읽는 데 필요한 만큼만, 세 문장 이내.</p>

  <h2>동작 원리</h2>
  <!-- 작은 숫자 예시가 단계별로 흘러가는 그림 -->

  <h2>이론</h2>
  <div class="theory">
    $$ y = f(x) $$
    <p>$x$: 기호의 뜻. $y$: 기호의 뜻. 위 그림의 어느 부분과 대응되는지.</p>
  </div>

  <h2>관련 개념</h2>
  <ul>
    <li><a href="other-concept.html">다른 개념</a></li>
  </ul>

  <h2>이력</h2>
  <ul class="history">
    <li>YYYY-MM-DD 최초 정리</li>
  </ul>
</main>
</body>
</html>
